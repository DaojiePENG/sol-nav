[project]
name = "sol-nav"
version = "0.1.0"
description = "SOL-Nav: Structured Observation Language for Efficient and Generalizable Vision-Language Navigation"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "peft>=0.6.0",
    "datasets>=2.14",
    "accelerate>=0.24",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "wandb>=0.16",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "PyMuPDF",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["sol_nav*"]
